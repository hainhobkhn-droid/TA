name: helpa
x-runtime: &runtime
  build: .
  image: helpa:local
  env_file: .env
  environment:
    DATABASE_URL: postgresql://helpa:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/helpa
  init: true
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: helpa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: helpa
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpa -d helpa"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *runtime
    command: ["node", "dist/server/server/db/migrate.js"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
  app:
    <<: *runtime
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes: ["media:/app/media"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    <<: *runtime
    command: ["node", "dist/server/server/worker.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes: ["media:/app/media"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "--input-type=module",
          "-e",
          'import pg from ''pg''; const p=new pg.Pool({connectionString:process.env.DATABASE_URL}); try { const r=await p.query("SELECT 1 FROM system_heartbeat WHERE name=''worker'' AND last_seen_at>now()-interval ''45 seconds''"); if(!r.rowCount) process.exitCode=1; } catch { process.exitCode=1; } finally { await p.end(); }',
        ]
      interval: 20s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      CADDY_TLS: ${CADDY_TLS:-internal}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres_data:
  media:
  caddy_data:
  caddy_config:
